<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title data-t="title"></title><style>
:root{color-scheme:light dark;--muted:#666;--border:#aaa}*{box-sizing:border-box}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:CanvasText;background:Canvas}main{max-width:680px;margin:0 auto;padding:32px}h1{font-size:26px;margin:0 0 8px}p{line-height:1.6;color:var(--muted);margin:8px 0 20px}label{display:block;font-weight:600;margin:22px 0 8px}textarea,input{font:inherit;color:CanvasText;background:Field;border:1px solid var(--border);border-radius:8px;padding:10px;width:100%}textarea{height:125px;resize:vertical}button{font:inherit;border:1px solid var(--border);border-radius:7px;color:ButtonText;background:ButtonFace;min-height:36px;padding:6px 14px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.presets{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:24px}.foot{display:flex;gap:12px;align-items:center;margin-top:28px}#status{line-height:1.5}small{display:block;color:var(--muted);line-height:1.5;margin-top:7px}.keyrow{display:flex;gap:10px}.keyrow input{flex:1}.error{color:#c33232}.success{color:#24803b}
@media(prefers-color-scheme:dark){:root{--muted:#b8b8b8;--border:#777}.error{color:#ff9999}.success{color:#91d6a4}}
</style></head><body><main><h1 data-t="heading"></h1><p data-t="intro"></p><section id="keybox"><label for="key" data-t="key"></label><div class="keyrow" id="keyrow"><input id="key" type="password" autocomplete="off" spellcheck="false" data-tp="key_placeholder"><button id="savekey" type="button" data-t="save_key"></button></div><small id="keystatus" data-t="key_reading"></small></section><form id="settings"><label for="instruction" data-t="instruction"></label><textarea id="instruction" maxlength="300" data-tp="instruction_placeholder"></textarea><small data-t="instruction_help"></small><div class="presets"><button type="button" data-preset="preset_whisper_text" data-t="preset_whisper"></button><button type="button" data-preset="preset_fast_text" data-t="preset_fast"></button><button type="button" data-preset="preset_slow_text" data-t="preset_slow"></button><button type="button" data-preset="preset_dialect_text" data-t="preset_dialect"></button><button type="button" data-preset="" data-t="preset_agent"></button></div><div class="row"><div><label for="speed" data-t="speed"></label><input id="speed" type="number" min="0.5" max="2" step="0.05" value="1" required><small data-t="speed_help"></small></div><div><label for="volume" data-t="volume"></label><input id="volume" type="number" min="0" max="100" step="1" value="100" required><small data-t="volume_help"></small></div></div><div class="foot"><button id="save" type="submit" disabled data-t="save"></button><button id="reload" type="button" data-t="reload"></button><span id="status" role="status" aria-live="polite" data-t="reading"></span></div></form><p style="font-size:13px;margin-top:26px" data-t="footer"></p></main><script>
const S=@@STRINGS@@;document.documentElement.lang=S.lang==='en'?'en':'zh-CN';
function t(k,...a){let s=S.t[k]??k;for(const v of a)s=s.replace(/%[sd]/,()=>String(v));return s}
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
let seq=0,pending=new Map(),loaded=false;
const status=document.getElementById('status'),save=document.getElementById('save');
function request(action,settings,key){const id=String(++seq);return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error(t('timeout')))},12000);pending.set(id,{resolve,reject,timer});window.webkit.messageHandlers.megaSpeak.postMessage(JSON.stringify({id,action,settings,key}));})}
window.receiveSettingsReply=function(r){const p=pending.get(r.id);if(!p)return;clearTimeout(p.timer);pending.delete(r.id);if(r.ok)p.resolve(r.state);else p.reject(new Error(r.error||t('failed')))};
function show(message,error=false){status.textContent=message;status.className=error?'error':'success'}
function fill(s){document.getElementById('instruction').value=s.delivery_instruction||'';document.getElementById('speed').value=s.speed;document.getElementById('volume').value=s.volume;loaded=true;save.disabled=false}
const keyInput=document.getElementById('key'),keyStatus=document.getElementById('keystatus'),saveKey=document.getElementById('savekey');
function showKey(k){const own=k.source==='none'||k.source==='saved';document.getElementById('keyrow').hidden=!own;
if(k.source==='none'){keyStatus.textContent=t('key_none');keyStatus.className='error';keyInput.focus()}
else if(k.source==='saved'){keyStatus.textContent=t('key_saved',k.hint||'');keyStatus.className='success'}
else{keyStatus.textContent=t('key_config',k.source);keyStatus.className=''}}
async function refreshKey(){try{showKey(await request('key-state'))}catch(e){keyStatus.textContent=e.message;keyStatus.className='error'}}
async function storeKey(){const v=keyInput.value.trim();if(!v){keyStatus.textContent=t('key_empty');keyStatus.className='error';return}saveKey.disabled=true;try{showKey(await request('set-key',undefined,v));keyInput.value=''}catch(e){keyStatus.textContent=e.message;keyStatus.className='error'}finally{saveKey.disabled=false}}
saveKey.onclick=storeKey;keyInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();storeKey()}};
window.refreshSettings=async function(){refreshKey();save.disabled=true;try{fill(await request('state'));show(t('loaded'))}catch(e){show(e.message,true);save.disabled=!loaded}};
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{document.getElementById('instruction').value=b.dataset.preset?t(b.dataset.preset):'';show(t('unsaved'))});
document.getElementById('reload').onclick=window.refreshSettings;
document.getElementById('settings').onsubmit=async e=>{e.preventDefault();save.disabled=true;show(t('saving'));try{const s=await request('save',{delivery_instruction:document.getElementById('instruction').value,speed:Number(document.getElementById('speed').value),volume:Number(document.getElementById('volume').value)});fill(s);show(t('saved'))}catch(err){show(err.message,true)}finally{save.disabled=!loaded}};
window.refreshSettings();
</script></body></html>
