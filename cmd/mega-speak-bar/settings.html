<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><title>Mega Speak 设置</title><style>
:root{color-scheme:light dark;--muted:#666;--border:#aaa}*{box-sizing:border-box}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:CanvasText;background:Canvas}main{max-width:680px;margin:0 auto;padding:32px}h1{font-size:26px;margin:0 0 8px}p{line-height:1.6;color:var(--muted);margin:8px 0 20px}label{display:block;font-weight:600;margin:22px 0 8px}textarea,input{font:inherit;color:CanvasText;background:Field;border:1px solid var(--border);border-radius:8px;padding:10px;width:100%}textarea{height:125px;resize:vertical}button{font:inherit;border:1px solid var(--border);border-radius:7px;color:ButtonText;background:ButtonFace;min-height:36px;padding:6px 14px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.presets{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:24px}.foot{display:flex;gap:12px;align-items:center;margin-top:28px}#status{line-height:1.5}small{display:block;color:var(--muted);line-height:1.5;margin-top:7px}.keyrow{display:flex;gap:10px}.keyrow input{flex:1}.error{color:#c33232}.success{color:#24803b}
@media(prefers-color-scheme:dark){:root{--muted:#b8b8b8;--border:#777}.error{color:#ff9999}.success{color:#91d6a4}}
</style></head><body><main><h1>语音设置</h1><p>调整你想听到的说话方式。保存后，下一次本地或远程 Agent 播报就会使用这些偏好。</p><section id="keybox"><label for="key">语音钥匙</label><div class="keyrow" id="keyrow"><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴你收到的语音钥匙"><button id="savekey" type="button">保存钥匙</button></div><small id="keystatus">正在读取钥匙…</small></section><form id="settings"><label for="instruction">播报偏好</label><textarea id="instruction" maxlength="300" placeholder="例如：用悄悄话轻声说；语速明显快一些，但吐字清楚。"></textarea><small>与 Agent 每次提供的语音指令一起生效。发生冲突时，优先遵循这里的偏好；留空即可恢复 Agent 自己的表达。</small><div class="presets"><button type="button" data-preset="你压低声音，用悄悄话的语气轻轻说。">悄悄话</button><button type="button" data-preset="语速明显比平时快，像赶时间跟同事交代事情一样，但吐字清楚。">快一点</button><button type="button" data-preset="语速放慢，用平静、温和的语气说。">慢一点</button><button type="button" data-preset="用自然、亲切的四川话说，吐字清楚。">四川话</button><button type="button" data-preset="">跟随 Agent</button></div><div class="row"><div><label for="speed">精确倍速</label><input id="speed" type="number" min="0.5" max="2" step="0.05" value="1" required><small>0.5–2.0 倍。想保持自然口吻，可用上面的“快一点”指令。</small></div><div><label for="volume">播放音量</label><input id="volume" type="number" min="0" max="100" step="1" value="100" required><small>0–100。悄悄话会改变表达方式，音量则控制播放大小。</small></div></div><div class="foot"><button id="save" type="submit" disabled>保存设置</button><button id="reload" type="button">重新载入</button><span id="status" role="status" aria-live="polite">正在读取设置…</span></div></form><p style="font-size:13px;margin-top:26px">音色可从菜单的“选择音色…”调整。Inbox 中读完的播报可以归档，之后在 History 里查看。</p></main><script>
let seq=0,pending=new Map(),loaded=false;
const status=document.getElementById('status'),save=document.getElementById('save');
function request(action,settings,key){const id=String(++seq);return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('操作超时，请重新载入后重试。'))},12000);pending.set(id,{resolve,reject,timer});window.webkit.messageHandlers.megaSpeak.postMessage(JSON.stringify({id,action,settings,key}));})}
window.receiveSettingsReply=function(r){const p=pending.get(r.id);if(!p)return;clearTimeout(p.timer);pending.delete(r.id);if(r.ok)p.resolve(r.state);else p.reject(new Error(r.error||'设置操作失败。'))};
function show(message,error=false){status.textContent=message;status.className=error?'error':'success'}
function fill(s){document.getElementById('instruction').value=s.delivery_instruction||'';document.getElementById('speed').value=s.speed;document.getElementById('volume').value=s.volume;loaded=true;save.disabled=false}
const keyInput=document.getElementById('key'),keyStatus=document.getElementById('keystatus'),saveKey=document.getElementById('savekey');
function showKey(k){const own=k.source==='none'||k.source==='saved';document.getElementById('keyrow').hidden=!own;
if(k.source==='none'){keyStatus.textContent='还没有钥匙。粘贴你收到的语音钥匙并保存，Mega Speak 才能说话。';keyStatus.className='error';keyInput.focus()}
else if(k.source==='saved'){keyStatus.textContent='钥匙已保存（结尾 '+(k.hint||'')+'）。要更换，粘贴新钥匙后保存。';keyStatus.className='success'}
else{keyStatus.textContent='钥匙由配置提供（'+k.source+'），这里无需填写。';keyStatus.className=''}}
async function refreshKey(){try{showKey(await request('key-state'))}catch(e){keyStatus.textContent=e.message;keyStatus.className='error'}}
async function storeKey(){const v=keyInput.value.trim();if(!v){keyStatus.textContent='请先粘贴钥匙。';keyStatus.className='error';return}saveKey.disabled=true;try{showKey(await request('set-key',undefined,v));keyInput.value=''}catch(e){keyStatus.textContent=e.message;keyStatus.className='error'}finally{saveKey.disabled=false}}
saveKey.onclick=storeKey;keyInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();storeKey()}};
window.refreshSettings=async function(){refreshKey();save.disabled=true;try{fill(await request('state'));show('设置已载入。')}catch(e){show(e.message,true);save.disabled=!loaded}};
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{document.getElementById('instruction').value=b.dataset.preset;show('尚未保存。可继续编辑这条指令。')});
document.getElementById('reload').onclick=window.refreshSettings;
document.getElementById('settings').onsubmit=async e=>{e.preventDefault();save.disabled=true;show('正在保存…');try{const s=await request('save',{delivery_instruction:document.getElementById('instruction').value,speed:Number(document.getElementById('speed').value),volume:Number(document.getElementById('volume').value)});fill(s);show('已保存，下一次播报生效。')}catch(err){show(err.message,true)}finally{save.disabled=!loaded}};
window.refreshSettings();
</script></body></html>
