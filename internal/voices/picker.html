<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file: data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>Mega Speak · 音色库</title><style>
:root{color-scheme:light;--ink:#243b38;--muted:#596967;--line:#d9e1dc;--paper:#f6f5ef;--accent:#225b52;--soft:#e7efeb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer;min-height:36px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:6px 12px}button:hover{border-color:var(--accent);background:#eef3f0}button:disabled{cursor:wait;opacity:.58}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #558f82;outline-offset:2px}header{padding:16px 24px 12px;border-bottom:1px solid var(--line);background:#fbfaf6}h1{font-size:24px;letter-spacing:-.6px;margin:0 0 5px;font-weight:650}.subtitle{margin:0;color:var(--muted);line-height:1.65}.current{margin-top:10px;padding:8px 12px;background:var(--soft);border-radius:7px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.current strong{color:var(--accent)}.current code{font-size:11px;overflow-wrap:anywhere}.toolbar{padding:12px 24px 8px;position:sticky;top:0;background:var(--paper);z-index:2;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:white}.search{width:100%;padding:9px 13px;border-radius:7px;border:1px solid #abbfb6;background:white;font-size:15px;margin-bottom:9px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.filters label{font-size:11px;color:var(--muted);display:grid;gap:4px;flex:1;min-width:110px}.filters select{padding:8px;background:#fff;border:1px solid var(--line);border-radius:5px;color:var(--ink);min-height:36px;width:100%}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);padding:8px 0 0;font-size:12px}.status{min-height:22px;margin:6px 0 0;line-height:1.6;color:var(--accent)}.status.error{color:#9b312b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px 24px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;min-width:0}.card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.identity{display:flex;align-items:center;gap:11px;position:relative;padding-right:31px}.avatar{width:54px;height:54px;object-fit:cover;border-radius:50%;background:var(--soft)}h2{font-size:16px;margin:0 0 5px;line-height:1.4}.demographics{font-size:12px;color:var(--muted)}.star{position:absolute;right:-3px;top:-3px;width:34px;min-height:34px;padding:0;font-size:22px;border:0;background:none}.star[aria-pressed=true]{color:#8b6406}.description{line-height:1.7;color:#455854;margin:13px 0;min-height:47px}.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{font-size:11px;background:#eff3f1;color:#48665b;border-radius:4px;padding:4px 6px}.id{display:block;margin:13px 0 10px;overflow-wrap:anywhere;font:10px/1.6 ui-monospace,SFMono-Regular,monospace;color:var(--muted);user-select:all}.actions{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}.actions button{font-size:12px;padding:6px 9px;flex:1;white-space:nowrap}.choose{background:var(--accent);border-color:var(--accent);color:#fff}.choose:hover{background:#17483f;color:#fff}.choose[aria-pressed=true]{background:var(--soft);color:var(--accent)}details{margin:11px 0;font-size:12px;color:var(--muted);line-height:1.7}summary{cursor:pointer;color:var(--ink)}.detail-content{padding-top:7px}.empty{grid-column:1/-1;padding:60px 10px;text-align:center;color:var(--muted)}footer{position:fixed;bottom:0;left:0;right:0;background:#fbfaf6;border-top:1px solid var(--line);padding:12px 28px;z-index:3;display:flex;align-items:center;gap:15px;min-height:82px}.player-info{min-width:130px;max-width:240px;font-size:13px}.player-info small{display:block;color:var(--muted);margin-top:4px;font-size:11px}#audio-host{flex:1}audio{width:100%;height:38px}.footer-note{font-size:12px;color:var(--muted)}#retry{display:none}#copy-fallback{width:100%;padding:9px;display:none;margin-top:8px}#clear{font-size:12px;min-width:64px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header,.toolbar{padding-left:20px;padding-right:20px}.grid{padding-left:20px;padding-right:20px}}@media(max-width:570px){.grid{grid-template-columns:1fr}.filters label{min-width:42%}header{padding-top:18px}footer{padding:12px 16px;gap:8px}.player-info{min-width:85px;max-width:130px}.current code{font-size:10px}}
</style></head><body>
<header><h1>选一个，你喜欢的声音</h1><p class="subtitle" id="subtitle"></p><div class="current"><span>当前音色</span><strong id="current-name">正在读取…</strong><code id="current-id"></code></div></header>
<main><div class="toolbar"><div class="tabs" role="group" aria-label="音色范围"><button id="favorites" aria-pressed="true">我的收藏</button><button id="all" aria-pressed="false">全部音色</button></div><input class="search" id="search" type="search" placeholder="搜索音色名称、介绍或音色 ID" aria-label="搜索音色"><div class="filters"><label>性别<select id="gender"></select></label><label>年龄<select id="age"></select></label><label>语言<select id="language"></select></label><label>分类<select id="category"></select></label><button id="clear">重置</button></div><div class="meta"><span id="count"></span><span id="date"></span></div><p class="status" id="status" role="status" aria-live="polite"></p><button id="retry">重新读取设置</button><input id="copy-fallback" readonly aria-label="音色 ID，请手动复制"></div><div id="grid" class="grid"></div></main>
<footer><div class="player-info"><strong id="playing-name">官方试听</strong><small id="playing-detail">播放本地样本，无需重新合成</small></div><div id="audio-host"><span class="footer-note">点音色卡片上的「试听」即可播放。</span></div><button id="stop" disabled>停止</button></footer>
<script type="application/json" id="catalog">@@CATALOG@@</script><script>
'use strict';
const data=JSON.parse(document.getElementById('catalog').textContent),voices=data.voices;
const $=id=>document.getElementById(id),native=!!window.webkit?.messageHandlers?.megaSpeak;
const pending=new Map(),favoriteBusy=new Set();let requestSeq=0,choosePending=false,current='',favorites=new Set(),stateReady=!native,scope='favorites',audio=null,playing='',playToken=0;
const languageCode=code=>code==='zh'?'zh-cn':code;
const languageNames={'zh':'中文','ar':'阿拉伯语','fil':'菲律宾语','ms':'马来语','mx':'墨西哥音色','th':'泰语','vi':'越南语','zh-cn':'中文','en':'英语','ja':'日语','id':'印尼语','es-mx':'西班牙语（墨西哥）','pt-br':'葡萄牙语（巴西）','de':'德语','fr':'法语','ko':'韩语','it':'意大利语','ru':'俄语'};
const capture=data.captured||data.metadata?.captured_at?.slice(0,10)||'2026-10-08';
$('date').textContent='目录快照 · '+capture.slice(0,10);
$('subtitle').textContent=voices.length+' 个音色 · 名称、属性、图标'+(native?'和试听均已保存在本地。':'已保存，可随时搜索与筛选。');
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function request(action,extra={}){
 if(!native)return Promise.reject(new Error('此目录在浏览器中打开，不能修改 Mega Speak 配置。'));
 const id=(window.crypto?.randomUUID?.()||String(Date.now())+'-'+(++requestSeq));
 return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('App 未返回结果，请重新读取设置后重试。'))},22000);pending.set(id,{resolve,reject,timer});window.webkit.messageHandlers.megaSpeak.postMessage(JSON.stringify({id,action,...extra}))});
}
window.receiveReply=function(reply){const p=pending.get(reply.id);if(!p)return;clearTimeout(p.timer);pending.delete(reply.id);if(reply.state){current=reply.state.current_voice||'';if(Array.isArray(reply.state.favorites))favorites=new Set(reply.state.favorites);stateReady=!reply.state.error;updateCurrent();render()}if(reply.ok)p.resolve(reply);else p.reject(new Error(reply.error||'操作未完成，请重试。'))};
window.refreshVoiceState=async()=>{if(!native)return;try{await request('state');$('retry').style.display='none';status('收藏与当前音色已读取。')}catch(e){stateReady=false;render();status(e.message,true);$('retry').style.display='inline-block'}};
function updateCurrent(){const v=voices.find(v=>v.voice_id===current);$('current-name').textContent=v?.name||(current?'目录外的音色':(native?'尚未读取':'默认音色快照'));$('current-id').textContent=current}
function initializeSelect(id,values,caption){const select=$(id);const empty=node('option',caption);empty.value='';select.append(empty);for(const value of [...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'))){const option=node('option',id==='language'?(languageNames[value]||value):value);option.value=value;select.append(option)}select.addEventListener('change',render)}
initializeSelect('gender',voices.map(v=>v.gender),'全部性别');initializeSelect('age',voices.map(v=>v.age),'全部年龄');initializeSelect('language',voices.flatMap(v=>v.languages.map(l=>languageCode(l.Language))),'全部语言');initializeSelect('category',voices.flatMap(v=>v.categories),'全部分类');
function matches(v){const q=$('search').value.trim().toLowerCase();const hay=[v.name,v.voice_id,v.description,v.gender,v.age,...v.categories,...v.labels,...v.tags,...v.languages.map(l=>languageNames[l.Language]||l.Language)].join(' ').toLowerCase();return(scope!=='favorites'||favorites.has(v.voice_id))&&(!q||hay.includes(q))&&(!$('gender').value||v.gender===$('gender').value)&&(!$('age').value||v.age===$('age').value)&&(!$('language').value||v.languages.some(l=>languageCode(l.Language)===$('language').value))&&(!$('category').value||v.categories.includes($('category').value))}
function render(){
 $('favorites').textContent='我的收藏 · '+voices.filter(v=>favorites.has(v.voice_id)).length;$('all').textContent='全部音色 · '+voices.length;
 $('favorites').setAttribute('aria-pressed',String(scope==='favorites'));$('all').setAttribute('aria-pressed',String(scope==='all'));
 const filtered=voices.filter(matches);$('count').textContent='显示 '+filtered.length+' / '+(scope==='favorites'?voices.filter(v=>favorites.has(v.voice_id)).length:voices.length)+' 个音色';
 const fragment=document.createDocumentFragment();
 for(const v of filtered){
  const card=node('article',undefined,'card'+(v.voice_id===current?' active':''));card.dataset.voice=v.voice_id;
  const identity=node('div',undefined,'identity'),img=node('img',undefined,'avatar');img.src=v.icon;img.alt=v.name+'图标';img.loading='lazy';identity.append(img);
  const title=node('div');title.append(node('h2',v.name),node('div',[v.gender,v.age].filter(Boolean).join(' · '),'demographics'));identity.append(title);
  const star=node('button',favorites.has(v.voice_id)?'★':'☆','star');star.setAttribute('aria-label',(favorites.has(v.voice_id)?'取消收藏 ':'收藏 ')+v.name);star.setAttribute('aria-pressed',String(favorites.has(v.voice_id)));star.disabled=favoriteBusy.has(v.voice_id)||(native&&!stateReady);star.addEventListener('click',async()=>{const yes=!favorites.has(v.voice_id);favoriteBusy.add(v.voice_id);star.disabled=true;try{if(native)await request('favorite',{voice:v.voice_id,favorite:yes});else{if(yes)favorites.add(v.voice_id);else favorites.delete(v.voice_id);localStorage.setItem('mega-speak-voice-favorites',JSON.stringify([...favorites]));render()}status((yes?'已收藏 ':'已取消收藏 ')+v.name)}catch(e){status(e.message,true)}finally{favoriteBusy.delete(v.voice_id);render()}});identity.append(star);card.append(identity,node('p',v.description,'description'));
  const tags=node('div',undefined,'tags');for(const tag of [...new Set([...v.languages.map(l=>(l.Flag||'')+' '+(languageNames[l.Language]||l.Language)),...v.categories,...v.labels])])tags.append(node('span',tag,'tag'));card.append(tags);
  const details=node('details');details.append(node('summary','完整属性与试听文本'));const content=node('div',undefined,'detail-content');content.append(node('div','模型：'+v.resource_id),node('div','标签：'+(v.labels.join(' / ')||'来源未填写')),node('div','情绪枚举：'+(v.emotions.map(e=>typeof e==='string'?e:(e.Label||e.Value||'')).filter(Boolean).join(' / ')||'来源未填写')));for(const l of v.languages)if(l.Text)content.append(node('p',(languageNames[l.Language]||l.Language)+'样本：'+l.Text));details.append(content);card.append(details,node('code',v.voice_id,'id'));
  const actions=node('div',undefined,'actions'),preview=node('button',playing===v.voice_id?'停止试听':'试听');preview.setAttribute('aria-label','试听 '+v.name);preview.addEventListener('click',()=>playing===v.voice_id?window.stopPreview():play(v));actions.append(preview);
  const copy=node('button','复制 ID');copy.addEventListener('click',async()=>{try{if(native)await request('copy',{voice:v.voice_id});else await navigator.clipboard.writeText(v.voice_id);$('copy-fallback').style.display='none';status('已复制 '+v.name+' 的音色 ID。')}catch(e){$('copy-fallback').value=v.voice_id;$('copy-fallback').style.display='block';$('copy-fallback').select();status('自动复制未完成，已选中 ID，请按 ⌘C 复制。',true)}});actions.append(copy);
  if(native){const choose=node('button',v.voice_id===current?'正在使用':'使用此音色','choose');choose.setAttribute('aria-pressed',String(v.voice_id===current));choose.disabled=!stateReady||choosePending||v.voice_id===current;choose.addEventListener('click',async()=>{choosePending=true;render();status('正在保存 '+v.name+'…');try{await request('choose',{voice:v.voice_id});status('已使用 '+v.name+'，后续 Mega Speak 会读取这个选择。')}catch(e){status(e.message,true)}finally{choosePending=false;render()}});actions.append(choose)}
  card.append(actions);fragment.append(card)
 }
 if(!filtered.length)fragment.append(node('div',scope==='favorites'?'这里还没有匹配的收藏。可查看全部音色，点 ☆ 加入收藏。':'没有匹配的音色。请换个关键词或重置筛选。','empty'));
 $('grid').replaceChildren(fragment);
}
window.stopPreview=function(reason){const wasPlaying=!!playing;playToken++;if(audio){audio.onended=audio.onerror=audio.onpause=audio.onplay=null;audio.pause();audio.removeAttribute('src');audio.load();audio=null}playing='';$('playing-name').textContent='官方试听';$('playing-detail').textContent='播放本地样本，无需重新合成';$('audio-host').replaceChildren(node('span','点音色卡片上的「试听」即可播放。','footer-note'));$('stop').disabled=true;render();if(wasPlaying)status(typeof reason==='string'?reason:'试听已停止。')};
function play(v){window.stopPreview();const token=++playToken;playing=v.voice_id;audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.src=v.preview||v.preview_url;$('audio-host').replaceChildren(audio);$('playing-name').textContent=v.name;$('playing-detail').textContent='正在打开试听…';$('stop').disabled=false;render();const fail=()=>{if(token!==playToken)return;window.stopPreview();status('试听无法播放，请重新打开 App；若仍失败，请检查本地音色文件。',true)};audio.onerror=fail;audio.onended=()=>{if(token===playToken)window.stopPreview('试听完成。')};audio.play().then(()=>{if(token===playToken){$('playing-detail').textContent='官方样本 · 本地播放';status('正在试听 '+v.name+'。')}}).catch(fail)}
$('stop').addEventListener('click',()=>window.stopPreview());$('search').addEventListener('input',render);$('favorites').addEventListener('click',()=>{scope='favorites';render()});$('all').addEventListener('click',()=>{scope='all';render()});$('clear').addEventListener('click',()=>{for(const id of ['search','gender','age','language','category'])$(id).value='';render()});$('retry').addEventListener('click',window.refreshVoiceState);
if(!native){try{const saved=localStorage.getItem('mega-speak-voice-favorites');favorites=new Set(saved?JSON.parse(saved):voices.filter(v=>v.favorite).map(v=>v.voice_id))}catch(e){favorites=new Set(voices.filter(v=>v.favorite).map(v=>v.voice_id))}current=data.metadata?.default_voice_at_capture||'';updateCurrent()}
render();if(native)window.refreshVoiceState();
</script></body></html>
