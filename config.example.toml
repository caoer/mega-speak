# mega-speak config: ~/.config/mega-speak/config.toml (or /etc/mega-speak/config.toml,
# or the file $MEGA_SPEAK_CONFIG names). Every key is optional; `mega-speak --print-config`
# shows what is in effect and which files were read.

# --- the voice -------------------------------------------------------------
voice = "zh_female_vv_uranus_bigtts"   # any seed-tts-2.0 *_uranus_bigtts voice
emotion = "neutral"                    # default preset; `mega-speak --list-emotions`
speed = 1.0                            # 0.5–2.0
volume = 100                           # playback volume 0–100
lead_in_ms = 400                       # silence before speech while the speaker wakes

# --- the Volcengine key ----------------------------------------------------
# Standard speech console key (X-Api-Key):
api_url = "https://openspeech.bytedance.com/api/v3/tts/unidirectional"
# Ark Agent Plan key: api_url = "https://openspeech.bytedance.com/api/v3/plan/tts/unidirectional"
# Console App ID + Access Token instead of an API key: set app_id, and the token is the key.
# app_id = "1234567890"
#
# The key itself: $MEGA_SPEAK_API_KEY, else one of these.
# api_key_file = "~/.config/mega-speak/api-key"
# api_key_cmd = ["security", "find-generic-password", "-s", "mega-speak", "-w"]

# --- another host's speaker (optional) ------------------------------------
# Leave these out to play here. To play on another machine, run mega-speak-server
# there behind a tunnel or reverse proxy, and point this host at it:
# output_host = "desk-mac"                          # that host's short hostname
# output_url = "https://speak.example.com/speak"
# token_file = "~/.config/mega-speak/token"         # or token_cmd = [...]
# output_ssh = "desk-mac"                           # used when no token is set

# [emotions]                                        # add or override presets
# grumpy = "你用有点不耐烦、嘟囔的语气说。"
